name: Keep Supabase Alive

on:
  schedule:
    # Tự động chạy vào 8h sáng (UTC) mỗi 3 ngày
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Nút cho phép bạn bấm chạy thử thủ công bất cứ lúc nào

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
